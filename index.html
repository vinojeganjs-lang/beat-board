<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beat Board — Screenplay Planner</title>

  <style>
    :root {
      --bg: #0d0e10;
      --panel: #14161a;
      --panel-2: #191b20;
      --card: #202329;
      --card-hover: #272a31;
      --border: #30343c;
      --text: #f1f1ed;
      --muted: #969ba5;
      --accent: #d8b36a;
      --accent-soft: rgba(216, 179, 106, 0.12);
      --danger: #d86f6f;
      --shadow: 0 12px 35px rgba(0, 0, 0, 0.28);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(216, 179, 106, 0.06), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ---------------- Header ---------------- */

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
      background: rgba(13, 14, 16, 0.92);
      backdrop-filter: blur(16px);
    }

    .header-inner {
      width: min(1600px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #4a4539;
      border-radius: 9px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 19px;
    }

    .brand h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .save-status {
      color: var(--muted);
      font-size: 12px;
      margin-right: 7px;
      white-space: nowrap;
    }

    .btn {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 13px;
      color: var(--text);
      background: var(--panel-2);
      transition: 0.18s ease;
    }

    .btn:hover {
      background: #22252b;
      border-color: #414650;
    }

    .btn-primary {
      color: #16130d;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .btn-primary:hover {
      background: #e5c27c;
      border-color: #e5c27c;
    }

    /* ---------------- Main board ---------------- */

    .main {
      width: min(1600px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 50px;
    }

    .board-intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .board-intro h2 {
      margin: 0 0 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 500;
    }

    .board-intro p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(250px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .act-column {
      min-width: 0;
      min-height: 430px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(20, 22, 26, 0.75);
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .act-column.drag-over {
      border-color: var(--accent);
      background: rgba(216, 179, 106, 0.055);
    }

    .act-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 5px 13px;
    }

    .act-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      font-weight: 500;
    }

    .act-count {
      min-width: 25px;
      height: 24px;
      padding: 0 7px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      color: var(--muted);
      background: #202329;
      font-size: 11px;
    }

    .cards {
      min-height: 370px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ---------------- Scene card ---------------- */

    .scene-card {
      position: relative;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.13);
      cursor: grab;
      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        background 0.15s ease,
        opacity 0.15s ease;
    }

    .scene-card:hover {
      background: var(--card-hover);
      border-color: #41454d;
      transform: translateY(-1px);
    }

    .scene-card.dragging {
      opacity: 0.38;
      transform: rotate(1deg);
    }

    .scene-card.drop-target {
      border-color: var(--accent);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .scene-number {
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
    }

    .card-menu {
      display: flex;
      gap: 3px;
      margin-top: -4px;
      margin-right: -5px;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
    }

    .icon-btn:hover {
      color: var(--text);
      background: #30333a;
    }

    .icon-btn.delete:hover {
      color: var(--danger);
    }

    .scene-heading {
      margin: 8px 0 9px;
      color: #e9e9e4;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.02em;
    }

    .beat {
      margin: 0;
      color: #d1d2d0;
      font-size: 13px;
      line-height: 1.5;
    }

    .characters {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 12px;
    }

    .character {
      padding: 4px 7px;
      border: 1px solid #353942;
      border-radius: 5px;
      color: #aeb2ba;
      background: #181a1f;
      font-size: 10px;
    }

    .empty-state {
      min-height: 90px;
      display: grid;
      place-items: center;
      padding: 18px;
      border: 1px dashed #30343b;
      border-radius: 9px;
      color: #626771;
      text-align: center;
      font-size: 12px;
    }

    /* ---------------- Modal ---------------- */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #15171b;
      box-shadow: var(--shadow);
    }

    .modal-header {
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      margin: 0 0 4px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 500;
    }

    .modal-header p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .form {
      padding: 20px 22px 22px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #b9bdc5;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #343840;
      border-radius: 8px;
      outline: none;
      color: var(--text);
      background: #0f1114;
      padding: 11px 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field textarea {
      min-height: 82px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #756342;
      box-shadow: 0 0 0 3px rgba(216, 179, 106, 0.08);
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #5f646d;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 5px;
    }

    /* ---------------- Toast ---------------- */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 100;
      transform: translate(-50%, 20px);
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #ddd;
      background: #202329;
      box-shadow: var(--shadow);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ---------------- Mobile ---------------- */

    @media (max-width: 1050px) {
      .board {
        grid-template-columns: repeat(2, minmax(260px, 1fr));
      }
    }

    @media (max-width: 650px) {
      .header-inner,
      .main {
        width: min(100% - 20px, 1600px);
      }

      .header-inner {
        min-height: 68px;
      }

      .brand p,
      .save-status {
        display: none;
      }

      .brand h1 {
        font-size: 20px;
      }

      .header-actions .btn {
        padding: 8px 10px;
      }

      .main {
        padding-top: 20px;
      }

      .board-intro {
        align-items: flex-start;
        flex-direction: column;
        margin-bottom: 17px;
      }

      .board-intro h2 {
        font-size: 24px;
      }

      .board {
        grid-template-columns: 1fr;
      }

      .act-column {
        min-height: 0;
      }

      .cards {
        min-height: 80px;
      }

      .empty-state {
        min-height: 65px;
      }

      .modal-backdrop {
        align-items: flex-end;
        padding: 0;
      }

      .modal {
        max-height: 92vh;
        border-radius: 15px 15px 0 0;
      }
    }
  </style>
</head>

<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <h1>Beat Board</h1>
          <p>Screenplay planning room</p>
        </div>
      </div>

      <div class="header-actions">
        <span class="save-status" id="saveStatus">Saved locally</span>
        <button class="btn" id="exportBtn">Export outline</button>
        <button class="btn btn-primary" id="addBtn">+ Add scene</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="board-intro">
      <div>
        <h2>Untitled screenplay</h2>
        <p id="sceneSummary">3 scenes · Everything is saved in this browser</p>
      </div>
    </div>

    <section class="board" id="board">

      <div class="act-column" data-act="Act 1">
        <div class="act-header">
          <h3 class="act-title">Act 1</h3>
          <span class="act-count">0</span>
        </div>
        <div class="cards"></div>
      </div>

      <div class="act-column" data-act="Act 2A">
        <div class="act-header">
          <h3 class="act-title">Act 2A</h3>
          <span class="act-count">0</span>
        </div>
        <div class="cards"></div>
      </div>

      <div class="act-column" data-act="Act 2B">
        <div class="act-header">
          <h3 class="act-title">Act 2B</h3>
          <span class="act-count">0</span>
        </div>
        <div class="cards"></div>
      </div>

      <div class="act-column" data-act="Act 3">
        <div class="act-header">
          <h3 class="act-title">Act 3</h3>
          <span class="act-count">0</span>
        </div>
        <div class="cards"></div>
      </div>

    </section>
  </main>

  <!-- Add / Edit Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h3 id="modalTitle">Add scene</h3>
        <p>Capture the scene in its simplest dramatic form.</p>
      </div>

      <form class="form" id="sceneForm">

        <div class="field">
          <label for="heading">Scene heading</label>
          <input
            id="heading"
            name="heading"
            type="text"
            required
            placeholder="INT. TEA STALL - NIGHT"
          />
        </div>

        <div class="field">
          <label for="beat">One-line beat</label>
          <textarea
            id="beat"
            name="beat"
            required
            placeholder="What changes in this scene?"
          ></textarea>
        </div>

        <div class="field">
          <label for="characters">Characters</label>
          <input
            id="characters"
            name="characters"
            type="text"
            placeholder="Arun, Meena, Tea Master"
          />
        </div>

        <div class="field">
          <label for="act">Act</label>
          <select id="act" name="act">
            <option value="Act 1">Act 1</option>
            <option value="Act 2A">Act 2A</option>
            <option value="Act 2B">Act 2B</option>
            <option value="Act 3">Act 3</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">
            Add scene
          </button>
        </div>

      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "beat-board-scenes-v1";

      const DEFAULT_SCENES = [
        {
          id: crypto.randomUUID(),
          heading: "EXT. BUS STAND - MORNING",
          beat: "Arun arrives in the city with one bag and a decision he has not told anyone about.",
          characters: ["Arun"],
          act: "Act 1"
        },
        {
          id: crypto.randomUUID(),
          heading: "INT. TEA STALL - NIGHT",
          beat: "A chance conversation reveals that Arun's old friend is connected to the problem he came to solve.",
          characters: ["Arun", "Meena", "Tea Master"],
          act: "Act 2A"
        },
        {
          id: crypto.randomUUID(),
          heading: "EXT. EMPTY STREET - NIGHT",
          beat: "Arun chooses to confront the truth instead of leaving town, setting the final confrontation in motion.",
          characters: ["Arun", "Meena"],
          act: "Act 3"
        }
      ];

      let scenes = loadScenes();
      let editingId = null;
      let draggedId = null;

      const board = document.getElementById("board");
      const modalBackdrop = document.getElementById("modalBackdrop");
      const sceneForm = document.getElementById("sceneForm");
      const modalTitle = document.getElementById("modalTitle");
      const saveBtn = document.getElementById("saveBtn");
      const addBtn = document.getElementById("addBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const exportBtn = document.getElementById("exportBtn");
      const saveStatus = document.getElementById("saveStatus");
      const sceneSummary = document.getElementById("sceneSummary");
      const toast = document.getElementById("toast");

      const headingInput = document.getElementById("heading");
      const beatInput = document.getElementById("beat");
      const charactersInput = document.getElementById("characters");
      const actInput = document.getElementById("act");

      function loadScenes() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);

          if (!stored) {
            const initial = structuredClone(DEFAULT_SCENES);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
            return initial;
          }

          const parsed = JSON.parse(stored);

          if (!Array.isArray(parsed)) {
            throw new Error("Invalid saved data");
          }

          return parsed;
        } catch (error) {
          console.warn("Could not load saved board:", error);
          return structuredClone(DEFAULT_SCENES);
        }
      }

      function saveScenes(showStatus = true) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(scenes));

          if (showStatus) {
            saveStatus.textContent = "Saved locally";
          }
        } catch (error) {
          console.error("Could not save board:", error);
          saveStatus.textContent = "Save failed";
        }
      }

      function render() {
        const columns = [...document.querySelectorAll(".act-column")];

        columns.forEach(column => {
          const act = column.dataset.act;
          const cardsContainer = column.querySelector(".cards");
          const count = column.querySelector(".act-count");

          cardsContainer.innerHTML = "";

          const actScenes = scenes.filter(scene => scene.act === act);

          count.textContent = actScenes.length;

          if (actScenes.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-state";
            empty.textContent = "Drop a scene here";
            cardsContainer.appendChild(empty);
          } else {
            actScenes.forEach((scene, index) => {
              cardsContainer.appendChild(createCard(scene, index));
            });
          }
        });

        sceneSummary.textContent =
          `${scenes.length} scene${scenes.length === 1 ? "" : "s"} · Everything is saved in this browser`;

        setupDragAndDrop();
      }

      function createCard(scene, index) {
        const card = document.createElement("article");
        card.className = "scene-card";
        card.draggable = true;
        card.dataset.id = scene.id;

        const top = document.createElement("div");
        top.className = "card-top";

        const number = document.createElement("span");
        number.className = "scene-number";
        number.textContent = `SCENE ${getGlobalSceneNumber(scene.id)}`;

        const menu = document.createElement("div");
        menu.className = "card-menu";

        const editButton = document.createElement("button");
        editButton.className = "icon-btn";
        editButton.type = "button";
        editButton.title = "Edit scene";
        editButton.setAttribute("aria-label", "Edit scene");
        editButton.textContent = "✎";

        editButton.addEventListener("click", event => {
          event.stopPropagation();
          openEditModal(scene.id);
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "icon-btn delete";
        deleteButton.type = "button";
        deleteButton.title = "Delete scene";
        deleteButton.setAttribute("aria-label", "Delete scene");
        deleteButton.textContent = "×";

        deleteButton.addEventListener("click", event => {
          event.stopPropagation();
          deleteScene(scene.id);
        });

        menu.append(editButton, deleteButton);
        top.append(number, menu);

        const heading = document.createElement("div");
        heading.className = "scene-heading";
        heading.textContent = scene.heading;

        const beat = document.createElement("p");
        beat.className = "beat";
        beat.textContent = scene.beat;

        const characters = document.createElement("div");
        characters.className = "characters";

        const names = Array.isArray(scene.characters)
          ? scene.characters
          : [];

        names.forEach(name => {
          if (!name.trim()) return;

          const tag = document.createElement("span");
          tag.className = "character";
          tag.textContent = name.trim();
          characters.appendChild(tag);
        });

        card.append(top, heading, beat, characters);

        card.addEventListener("dblclick", () => {
          openEditModal(scene.id);
        });

        return card;
      }

      function getGlobalSceneNumber(id) {
        const index = scenes.findIndex(scene => scene.id === id);
        return index >= 0 ? index + 1 : "";
      }

      function openAddModal() {
        editingId = null;

        modalTitle.textContent = "Add scene";
        saveBtn.textContent = "Add scene";

        sceneForm.reset();
        actInput.value = "Act 1";

        modalBackdrop.classList.add("open");

        setTimeout(() => headingInput.focus(), 50);
      }

      function openEditModal(id) {
        const scene = scenes.find(item => item.id === id);

        if (!scene) return;

        editingId = id;

        modalTitle.textContent = "Edit scene";
        saveBtn.textContent = "Save changes";

        headingInput.value = scene.heading || "";
        beatInput.value = scene.beat || "";
        charactersInput.value = Array.isArray(scene.characters)
          ? scene.characters.join(", ")
          : "";
        actInput.value = scene.act || "Act 1";

        modalBackdrop.classList.add("open");

        setTimeout(() => headingInput.focus(), 50);
      }

      function closeModal() {
        modalBackdrop.classList.remove("open");
        editingId = null;
        sceneForm.reset();
      }

      function deleteScene(id) {
        const scene = scenes.find(item => item.id === id);

        if (!scene) return;

        const confirmed = window.confirm(
          `Delete this scene?\n\n${scene.heading}`
        );

        if (!confirmed) return;

        scenes = scenes.filter(item => item.id !== id);

        saveScenes();
        render();
        showToast("Scene deleted");
      }

      sceneForm.addEventListener("submit", event => {
        event.preventDefault();

        const heading = headingInput.value.trim();
        const beat = beatInput.value.trim();
        const characters = charactersInput.value
          .split(",")
          .map(name => name.trim())
          .filter(Boolean);
        const act = actInput.value;

        if (!heading || !beat) {
          return;
        }

        if (editingId) {
          const scene = scenes.find(item => item.id === editingId);

          if (scene) {
            scene.heading = heading;
            scene.beat = beat;
            scene.characters = characters;
            scene.act = act;
          }

          showToast("Scene updated");
        } else {
          scenes.push({
            id: crypto.randomUUID(),
            heading,
            beat,
            characters,
            act
          });

          showToast("Scene added");
        }

        saveScenes();
        render();
        closeModal();
      });

      addBtn.addEventListener("click", openAddModal);
      cancelBtn.addEventListener("click", closeModal);

      modalBackdrop.addEventListener("click", event => {
        if (event.target === modalBackdrop) {
          closeModal();
        }
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && modalBackdrop.classList.contains("open")) {
          closeModal();
        }
      });

      /* ---------------- Drag and drop ---------------- */

      function setupDragAndDrop() {
        const cards = document.querySelectorAll(".scene-card");
        const columns = document.querySelectorAll(".act-column");

        cards.forEach(card => {
          card.addEventListener("dragstart", handleDragStart);
          card.addEventListener("dragend", handleDragEnd);
          card.addEventListener("dragover", handleCardDragOver);
          card.addEventListener("drop", handleCardDrop);
        });

        columns.forEach(column => {
          column.addEventListener("dragover", handleColumnDragOver);
          column.addEventListener("dragleave", handleColumnDragLeave);
          column.addEventListener("drop", handleColumnDrop);
        });
      }

      function handleDragStart(event) {
        draggedId = event.currentTarget.dataset.id;

        event.currentTarget.classList.add("dragging");

        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", draggedId);
      }

      function handleDragEnd(event) {
        event.currentTarget.classList.remove("dragging");

        document.querySelectorAll(".drag-over, .drop-target").forEach(el => {
          el.classList.remove("drag-over", "drop-target");
        });

        draggedId = null;
      }

      function handleColumnDragOver(event) {
        event.preventDefault();

        const column = event.currentTarget;

        if (!draggedId) return;

        column.classList.add("drag-over");
      }

      function handleColumnDragLeave(event) {
        if (!event.currentTarget.contains(event.relatedTarget)) {
          event.currentTarget.classList.remove("drag-over");
        }
      }

      function handleCardDragOver(event) {
        event.preventDefault();
        event.stopPropagation();

        const card = event.currentTarget;

        if (card.dataset.id !== draggedId) {
          card.classList.add("drop-target");
        }
      }

      function handleCardDrop(event) {
        event.preventDefault();
        event.stopPropagation();

        const targetCard = event.currentTarget;
        const targetId = targetCard.dataset.id;

        if (!draggedId || draggedId === targetId) return;

        moveSceneBefore(draggedId, targetId);

        targetCard.classList.remove("drop-target");

        saveScenes();
        render();
        showToast("Scenes reordered");
      }

      function handleColumnDrop(event) {
        event.preventDefault();

        const column = event.currentTarget;
        const targetAct = column.dataset.act;

        column.classList.remove("drag-over");

        if (!draggedId) return;

        const scene = scenes.find(item => item.id === draggedId);

        if (!scene) return;

        const targetContainer = column.querySelector(".cards");
        const cards = [...targetContainer.querySelectorAll(".scene-card")];

        /*
         * If dropped directly on the empty area of a column,
         * append the scene to the end of that act.
         */
        if (!event.target.closest(".scene-card")) {
          scenes = scenes.filter(item => item.id !== draggedId);

          scene.act = targetAct;
          scenes.push(scene);

          reorderByAct();

          saveScenes();
          render();
          showToast("Scene moved");
        }
      }

      function moveSceneBefore(draggedId, targetId) {
        const dragged = scenes.find(item => item.id === draggedId);
        const target = scenes.find(item => item.id === targetId);

        if (!dragged || !target) return;

        scenes = scenes.filter(item => item.id !== draggedId);

        dragged.act = target.act;

        const targetIndex = scenes.findIndex(item => item.id === targetId);

        scenes.splice(targetIndex, 0, dragged);
      }

      function reorderByAct() {
        const acts = ["Act 1", "Act 2A", "Act 2B", "Act 3"];
        const ordered = [];

        acts.forEach(act => {
          scenes
            .filter(scene => scene.act === act)
            .forEach(scene => ordered.push(scene));
        });

        scenes = ordered;
      }

      /* ---------------- Export ---------------- */

      exportBtn.addEventListener("click", () => {
        if (scenes.length === 0) {
          showToast("Nothing to export yet");
          return;
        }

        const acts = ["Act 1", "Act 2A", "Act 2B", "Act 3"];
        const lines = [];

        lines.push("SCREENPLAY OUTLINE");
        lines.push("==================");
        lines.push("");

        let number = 1;

        acts.forEach(act => {
          const actScenes = scenes.filter(scene => scene.act === act);

          if (actScenes.length === 0) return;

          lines.push(act.toUpperCase());
          lines.push("-".repeat(act.length + 1));

          actScenes.forEach(scene => {
            const characterText = scene.characters.length
              ? ` [${scene.characters.join(", ")}]`
              : "";

            lines.push(
              `${number}. ${scene.heading}`
            );

            lines.push(
              `   ${scene.beat}${characterText}`
            );

            lines.push("");

            number++;
          });
        });

        const text = lines.join("\n");

        const blob = new Blob([text], {
          type: "text/plain;charset=utf-8"
        });

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = "screenplay-outline.txt";

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);

        showToast("Outline exported");
      });

      /* ---------------- Toast ---------------- */

      let toastTimer;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 1800);
      }

      /* ---------------- Initial render ---------------- */

      render();

    })();
  </script>

</body>
</html>
