<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beat Board — Screenplay Planner</title>

  <style>
    :root {
      --bg: #0d0e10;
      --panel: #14161a;
      --panel-2: #191b20;
      --card: #202329;
      --card-hover: #272a31;
      --border: #30343c;
      --text: #f1f1ed;
      --muted: #969ba5;
      --accent: #d8b36a;
      --accent-soft: rgba(216, 179, 106, 0.12);
      --danger: #d86f6f;
      --shadow: 0 12px 35px rgba(0, 0, 0, 0.28);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(216, 179, 106, 0.06), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ---------------- Header ---------------- */

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
      background: rgba(13, 14, 16, 0.92);
      backdrop-filter: blur(16px);
    }

    .header-inner {
      width: min(1600px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #4a4539;
      border-radius: 9px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 19px;
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .save-status {
      color: var(--muted);
      font-size: 12px;
      margin-right: 7px;
      white-space: nowrap;
    }

    .btn {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 13px;
      color: var(--text);
      background: var(--panel-2);
      transition: 0.18s ease;
    }

    .btn:hover {
      background: #22252b;
      border-color: #414650;
    }

    .btn-primary {
      color: #16130d;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .btn-primary:hover {
      background: #e5c27c;
      border-color: #e5c27c;
    }

    /* ---------------- Main ---------------- */

    .main {
      width: min(1600px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 50px;
    }

    .board-intro {
      margin-bottom: 22px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .screenplay-title {
      margin: 0 0 5px;
      padding: 1px 4px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.3px;
      cursor: text;
      transition: 0.15s ease;
    }

    .screenplay-title:hover {
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.015);
    }

    .title-edit-icon {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .title-row:hover .title-edit-icon {
      opacity: 1;
    }

    .title-input {
      width: min(500px, 100%);
      margin: 0 0 5px;
      padding: 2px 5px;
      border: 1px solid #756342;
      border-radius: 5px;
      outline: none;
      color: var(--text);
      background: #101216;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 500;
    }

    .board-intro p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* ---------------- Character filters ---------------- */

    .character-filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 15px;
    }

    .filter-label {
      margin-right: 2px;
      color: #777c85;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .filter-chip {
      padding: 6px 9px;
      border: 1px solid #353942;
      border-radius: 20px;
      color: #aeb2ba;
      background: #181a1f;
      font-size: 11px;
      transition: 0.15s ease;
    }

    .filter-chip:hover {
      color: var(--text);
      border-color: #4a4e57;
    }

    .filter-chip.active {
      color: #17140e;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .clear-filter {
      display: none;
      padding: 5px 8px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
    }

    .clear-filter.visible {
      display: inline-block;
    }

    .clear-filter:hover {
      color: var(--text);
    }

    /* ---------------- Board ---------------- */

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(250px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .act-column {
      min-width: 0;
      min-height: 430px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(20, 22, 26, 0.75);
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .act-column.drag-over {
      border-color: var(--accent);
      background: rgba(216, 179, 106, 0.055);
    }

    .act-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 5px 13px;
    }

    .act-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      font-weight: 500;
    }

    .act-count {
      min-width: 25px;
      height: 24px;
      padding: 0 7px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      color: var(--muted);
      background: #202329;
      font-size: 11px;
    }

    .cards {
      min-height: 370px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ---------------- Scene card ---------------- */

    .scene-card {
      position: relative;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.13);
      cursor: grab;
      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        background 0.15s ease,
        opacity 0.15s ease;
    }

    .scene-card:hover {
      background: var(--card-hover);
      border-color: #41454d;
      transform: translateY(-1px);
    }

    .scene-card.dragging {
      opacity: 0.38;
      transform: rotate(1deg);
    }

    .scene-card.drop-target {
      border-color: var(--accent);
    }

    .scene-card.filtered-out {
      display: none;
    }

    .scene-card.filter-match {
      border-color: #6b5938;
      box-shadow:
        0 0 0 1px rgba(216, 179, 106, 0.1),
        0 5px 18px rgba(0, 0, 0, 0.13);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .scene-number {
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
    }

    .card-menu {
      display: flex;
      gap: 3px;
      margin-top: -4px;
      margin-right: -5px;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
    }

    .icon-btn:hover {
      color: var(--text);
      background: #30333a;
    }

    .icon-btn.delete:hover {
      color: var(--danger);
    }

    /* Mobile move/reorder controls */

    .move-controls {
      display: none;
      align-items: center;
      gap: 2px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid #2d3037;
    }

    .move-btn {
      flex: 1;
      height: 27px;
      border: 1px solid #30343b;
      border-radius: 5px;
      color: #8d929b;
      background: #181a1e;
      font-size: 13px;
      line-height: 1;
    }

    .move-btn:hover:not(:disabled) {
      color: var(--text);
      border-color: #4b4f58;
      background: #24272d;
    }

    .move-btn:disabled {
      opacity: 0.28;
      cursor: default;
    }

    .move-separator {
      width: 1px;
      height: 18px;
      margin: 0 3px;
      background: #353840;
    }

    .scene-heading {
      margin: 8px 0 9px;
      color: #e9e9e4;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.02em;
    }

    .beat {
      margin: 0;
      color: #d1d2d0;
      font-size: 13px;
      line-height: 1.5;
    }

    .characters {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 12px;
    }

    .character {
      padding: 4px 7px;
      border: 1px solid #353942;
      border-radius: 5px;
      color: #aeb2ba;
      background: #181a1f;
      font-size: 10px;
    }

    .empty-state {
      min-height: 90px;
      display: grid;
      place-items: center;
      padding: 18px;
      border: 1px dashed #30343b;
      border-radius: 9px;
      color: #626771;
      text-align: center;
      font-size: 12px;
    }

    /* ---------------- Modal ---------------- */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #15171b;
      box-shadow: var(--shadow);
    }

    .modal-header {
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      margin: 0 0 4px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 500;
    }

    .modal-header p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .form {
      padding: 20px 22px 22px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #b9bdc5;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #343840;
      border-radius: 8px;
      outline: none;
      color: var(--text);
      background: #0f1114;
      padding: 11px 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field textarea {
      min-height: 82px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #756342;
      box-shadow: 0 0 0 3px rgba(216, 179, 106, 0.08);
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #5f646d;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 5px;
    }

    /* ---------------- Toast ---------------- */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 100;
      transform: translate(-50%, 20px);
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #ddd;
      background: #202329;
      box-shadow: var(--shadow);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ---------------- Mobile ---------------- */

    @media (max-width: 1050px) {
      .board {
        grid-template-columns: repeat(2, minmax(260px, 1fr));
      }
    }

    @media (max-width: 650px) {
      .header-inner,
      .main {
        width: min(100% - 20px, 1600px);
      }

      .header-inner {
        min-height: 68px;
      }

      .brand p,
      .save-status {
        display: none;
      }

      .brand h1 {
        font-size: 20px;
      }

      .header-actions .btn {
        padding: 8px 10px;
      }

      .main {
        padding-top: 20px;
      }

      .screenplay-title {
        font-size: 24px;
      }

      .title-input {
        font-size: 24px;
      }

      .title-edit-icon {
        opacity: 1;
      }

      .board {
        grid-template-columns: 1fr;
      }

      .act-column {
        min-height: 0;
      }

      .cards {
        min-height: 80px;
      }

      .empty-state {
        min-height: 65px;
      }

      .move-controls {
        display: flex;
      }

      .modal-backdrop {
        align-items: flex-end;
        padding: 0;
      }

      .modal {
        max-height: 92vh;
        border-radius: 15px 15px 0 0;
      }
    }
  </style>
</head>

<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <h1>Beat Board</h1>
          <p>Screenplay planning room</p>
        </div>
      </div>

      <div class="header-actions">
        <span class="save-status" id="saveStatus">Saved locally</span>
        <button class="btn" id="exportBtn">Export outline</button>
        <button class="btn btn-primary" id="addBtn">+ Add scene</button>
      </div>
    </div>
  </header>

  <main class="main">

    <div class="board-intro">
      <div class="title-row" id="titleRow">
        <h2
          class="screenplay-title"
          id="screenplayTitle"
          title="Click to rename"
        >Untitled screenplay</h2>
        <span class="title-edit-icon">✎</span>
      </div>

      <input
        class="title-input"
        id="titleInput"
        type="text"
        maxlength="120"
        aria-label="Screenplay title"
        style="display:none;"
      />

      <p id="sceneSummary">
        3 scenes · Everything is saved in this browser
      </p>

      <div class="character-filters" id="characterFilters">
        <span class="filter-label">Characters</span>
      </div>
    </div>

    <section class="board" id="board">

      <div class="act-column" data-act="Act 1">
        <div class="act-header">
          <h3 class="act-title">Act 1</h3>
          <span class="act-count">0</span>
        </div>
        <div class="cards"></div>
      </div>

      <div class="act-column" data-act="Act 2A">
        <div class="act-header">
          <h3 class="act-title">Act 2A</h3>
          <span class="act-count">0</span>
        </div>
        <div class="cards"></div>
      </div>

      <div class="act-column" data-act="Act 2B">
        <div class="act-header">
          <h3 class="act-title">Act 2B</h3>
          <span class="act-count">0</span>
        </div>
        <div class="cards"></div>
      </div>

      <div class="act-column" data-act="Act 3">
        <div class="act-header">
          <h3 class="act-title">Act 3</h3>
          <span class="act-count">0</span>
        </div>
        <div class="cards"></div>
      </div>

    </section>
  </main>

  <!-- Add / Edit Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

      <div class="modal-header">
        <h3 id="modalTitle">Add scene</h3>
        <p>Capture the scene in its simplest dramatic form.</p>
      </div>

      <form class="form" id="sceneForm">

        <div class="field">
          <label for="heading">Scene heading</label>
          <input
            id="heading"
            name="heading"
            type="text"
            required
            placeholder="INT. TEA STALL - NIGHT"
          />
        </div>

        <div class="field">
          <label for="beat">One-line beat</label>
          <textarea
            id="beat"
            name="beat"
            required
            placeholder="What changes in this scene?"
          ></textarea>
        </div>

        <div class="field">
          <label for="characters">Characters</label>
          <input
            id="characters"
            name="characters"
            type="text"
            placeholder="Arun, Meena, Tea Master"
          />
        </div>

        <div class="field">
          <label for="act">Act</label>
          <select id="act" name="act">
            <option value="Act 1">Act 1</option>
            <option value="Act 2A">Act 2A</option>
            <option value="Act 2B">Act 2B</option>
            <option value="Act 3">Act 3</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">
            Add scene
          </button>
        </div>

      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "beat-board-scenes-v1";
      const TITLE_STORAGE_KEY = "beat-board-title-v1";

      const ACTS = ["Act 1", "Act 2A", "Act 2B", "Act 3"];

      const DEFAULT_SCENES = [
        {
          id: crypto.randomUUID(),
          heading: "EXT. BUS STAND - MORNING",
          beat: "Arun arrives in the city with one bag and a decision he has not told anyone about.",
          characters: ["Arun"],
          act: "Act 1"
        },
        {
          id: crypto.randomUUID(),
          heading: "INT. TEA STALL - NIGHT",
          beat: "A chance conversation reveals that Arun's old friend is connected to the problem he came to solve.",
          characters: ["Arun", "Meena", "Tea Master"],
          act: "Act 2A"
        },
        {
          id: crypto.randomUUID(),
          heading: "EXT. EMPTY STREET - NIGHT",
          beat: "Arun chooses to confront the truth instead of leaving town, setting the final confrontation in motion.",
          characters: ["Arun", "Meena"],
          act: "Act 3"
        }
      ];

      let scenes = loadScenes();
      let screenplayTitle = loadTitle();
      let editingId = null;
      let draggedId = null;
      let activeCharacterFilter = null;

      const board = document.getElementById("board");
      const modalBackdrop = document.getElementById("modalBackdrop");
      const sceneForm = document.getElementById("sceneForm");
      const modalTitle = document.getElementById("modalTitle");
      const saveBtn = document.getElementById("saveBtn");
      const addBtn = document.getElementById("addBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const exportBtn = document.getElementById("exportBtn");
      const saveStatus = document.getElementById("saveStatus");
      const sceneSummary = document.getElementById("sceneSummary");
      const toast = document.getElementById("toast");

      const screenplayTitleElement =
        document.getElementById("screenplayTitle");

      const titleInput =
        document.getElementById("titleInput");

      const characterFilters =
        document.getElementById("characterFilters");

      const headingInput =
        document.getElementById("heading");

      const beatInput =
        document.getElementById("beat");

      const charactersInput =
        document.getElementById("characters");

      const actInput =
        document.getElementById("act");

      /* ---------------- Storage ---------------- */

      function loadScenes() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);

          if (!stored) {
            const initial = structuredClone(DEFAULT_SCENES);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
            return initial;
          }

          const parsed = JSON.parse(stored);

          if (!Array.isArray(parsed)) {
            throw new Error("Invalid saved data");
          }

          /*
           * Normalize older v1 data in case a card did not have
           * a valid character array.
           */
          return parsed.map(scene => ({
            id: scene.id || crypto.randomUUID(),
            heading: scene.heading || "",
            beat: scene.beat || "",
            characters: Array.isArray(scene.characters)
              ? scene.characters
              : [],
            act: ACTS.includes(scene.act)
              ? scene.act
              : "Act 1"
          }));

        } catch (error) {
          console.warn("Could not load saved board:", error);
          return structuredClone(DEFAULT_SCENES);
        }
      }

      function loadTitle() {
        try {
          const stored = localStorage.getItem(TITLE_STORAGE_KEY);

          return stored && stored.trim()
            ? stored.trim()
            : "Untitled screenplay";
        } catch {
          return "Untitled screenplay";
        }
      }

      function saveScenes() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(scenes));
          saveStatus.textContent = "Saved locally";
        } catch (error) {
          console.error("Could not save scenes:", error);
          saveStatus.textContent = "Save failed";
        }
      }

      function saveTitle() {
        try {
          localStorage.setItem(
            TITLE_STORAGE_KEY,
            screenplayTitle
          );

          saveStatus.textContent = "Saved locally";
        } catch (error) {
          console.error("Could not save title:", error);
          saveStatus.textContent = "Save failed";
        }
      }

      /*
       * This is the canonical ordering function.
       *
       * Scenes are ALWAYS represented as:
       *
       * Act 1
       * Act 2A
       * Act 2B
       * Act 3
       *
       * while preserving their top-to-bottom order inside each act.
       */
      function getOrderedScenes() {
        const ordered = [];

        ACTS.forEach(act => {
          scenes
            .filter(scene => scene.act === act)
            .forEach(scene => ordered.push(scene));
        });

        return ordered;
      }

      /*
       * Normalize the underlying array after every structural change.
       * This guarantees the same order is used by rendering, numbering
       * and export.
       */
      function normalizeSceneOrder() {
        scenes = getOrderedScenes();
      }

      /* ---------------- Render ---------------- */

      function render() {
        normalizeSceneOrder();

        screenplayTitleElement.textContent = screenplayTitle;

        const orderedScenes = getOrderedScenes();

        ACTS.forEach(act => {
          const column =
            document.querySelector(
              `.act-column[data-act="${CSS.escape(act)}"]`
            );

          if (!column) return;

          const cardsContainer =
            column.querySelector(".cards");

          const count =
            column.querySelector(".act-count");

          cardsContainer.innerHTML = "";

          const actScenes =
            orderedScenes.filter(scene => scene.act === act);

          count.textContent = actScenes.length;

          if (actScenes.length === 0) {
            const empty = document.createElement("div");

            empty.className = "empty-state";
            empty.textContent = "Drop a scene here";

            cardsContainer.appendChild(empty);
          } else {
            actScenes.forEach(scene => {
              cardsContainer.appendChild(
                createCard(scene)
              );
            });
          }
        });

        sceneSummary.textContent =
          `${orderedScenes.length} scene${orderedScenes.length === 1 ? "" : "s"} · Everything is saved in this browser`;

        renderCharacterFilters();
        applyCharacterFilter();
        setupDragAndDrop();
      }

      /* ---------------- Character filters ---------------- */

      function getCharacters() {
        const names = new Set();

        scenes.forEach(scene => {
          scene.characters.forEach(character => {
            const name = character.trim();

            if (name) {
              names.add(name);
            }
          });
        });

        return [...names].sort((a, b) =>
          a.localeCompare(b, undefined, {
            sensitivity: "base"
          })
        );
      }

      function renderCharacterFilters() {
        characterFilters.innerHTML = "";

        const label = document.createElement("span");
        label.className = "filter-label";
        label.textContent = "Characters";

        characterFilters.appendChild(label);

        const characters = getCharacters();

        characters.forEach(character => {
          const chip = document.createElement("button");

          chip.type = "button";
          chip.className = "filter-chip";

          if (
            activeCharacterFilter &&
            activeCharacterFilter.toLowerCase() === character.toLowerCase()
          ) {
            chip.classList.add("active");
          }

          chip.textContent = character;

          chip.addEventListener("click", () => {
            if (
              activeCharacterFilter &&
              activeCharacterFilter.toLowerCase() === character.toLowerCase()
            ) {
              activeCharacterFilter = null;
            } else {
              activeCharacterFilter = character;
            }

            renderCharacterFilters();
            applyCharacterFilter();
          });

          characterFilters.appendChild(chip);
        });

        const clearButton = document.createElement("button");

        clearButton.type = "button";
        clearButton.className =
          "clear-filter" +
          (activeCharacterFilter ? " visible" : "");

        clearButton.textContent = "Clear";

        clearButton.addEventListener("click", () => {
          activeCharacterFilter = null;
          renderCharacterFilters();
          applyCharacterFilter();
        });

        characterFilters.appendChild(clearButton);
      }

      function applyCharacterFilter() {
        const cards =
          document.querySelectorAll(".scene-card");

        cards.forEach(card => {
          const id = card.dataset.id;

          const scene =
            scenes.find(item => item.id === id);

          if (!scene) return;

          if (!activeCharacterFilter) {
            card.classList.remove(
              "filtered-out",
              "filter-match"
            );
            return;
          }

          const matches =
            scene.characters.some(character =>
              character.toLowerCase() ===
              activeCharacterFilter.toLowerCase()
            );

          card.classList.toggle(
            "filtered-out",
            !matches
          );

          card.classList.toggle(
            "filter-match",
            matches
          );
        });
      }

      /* ---------------- Scene cards ---------------- */

      function createCard(scene) {
        const card = document.createElement("article");

        card.className = "scene-card";
        card.draggable = true;
        card.dataset.id = scene.id;

        const sceneNumber =
          getOrderedScenes().findIndex(
            item => item.id === scene.id
          ) + 1;

        const top = document.createElement("div");
        top.className = "card-top";

        const number = document.createElement("span");
        number.className = "scene-number";
        number.textContent =
          `SCENE ${sceneNumber}`;

        const menu = document.createElement("div");
        menu.className = "card-menu";

        const editButton =
          createIconButton(
            "✎",
            "Edit scene",
            () => openEditModal(scene.id)
          );

        const deleteButton =
          createIconButton(
            "×",
            "Delete scene",
            () => deleteScene(scene.id)
          );

        deleteButton.classList.add("delete");

        menu.append(editButton, deleteButton);
        top.append(number, menu);

        const heading =
          document.createElement("div");

        heading.className = "scene-heading";
        heading.textContent = scene.heading;

        const beat =
          document.createElement("p");

        beat.className = "beat";
        beat.textContent = scene.beat;

        const characters =
          document.createElement("div");

        characters.className = "characters";

        scene.characters.forEach(name => {
          if (!name.trim()) return;

          const tag =
            document.createElement("span");

          tag.className = "character";
          tag.textContent = name.trim();

          characters.appendChild(tag);
        });

        const moveControls =
          createMoveControls(scene);

        card.append(
          top,
          heading,
          beat,
          characters,
          moveControls
        );

        card.addEventListener("dblclick", () => {
          openEditModal(scene.id);
        });

        return card;
      }

      function createIconButton(
        symbol,
        title,
        handler
      ) {
        const button =
          document.createElement("button");

        button.className = "icon-btn";
        button.type = "button";
        button.title = title;
        button.setAttribute(
          "aria-label",
          title
        );
        button.textContent = symbol;

        button.addEventListener(
          "click",
          event => {
            event.stopPropagation();
            handler();
          }
        );

        return button;
      }

      /*
       * Mobile controls:
       *
       * ← previous act
       * ↑ move up
       * ↓ move down
       * → next act
       */
      function createMoveControls(scene) {
        const controls =
          document.createElement("div");

        controls.className = "move-controls";

        const actIndex =
          ACTS.indexOf(scene.act);

        const actScenes =
          getOrderedScenes().filter(
            item => item.act === scene.act
          );

        const localIndex =
          actScenes.findIndex(
            item => item.id === scene.id
          );

        const previousActButton =
          createMoveButton(
            "‹",
            "Move to previous act",
            actIndex === 0,
            () => moveToAct(
              scene.id,
              ACTS[actIndex - 1]
            )
          );

        const upButton =
          createMoveButton(
            "↑",
            "Move scene up",
            localIndex === 0,
            () => moveWithinAct(
              scene.id,
              -1
            )
          );

        const downButton =
          createMoveButton(
            "↓",
            "Move scene down",
            localIndex === actScenes.length - 1,
            () => moveWithinAct(
              scene.id,
              1
            )
          );

        const nextActButton =
          createMoveButton(
            "›",
            "Move to next act",
            actIndex === ACTS.length - 1,
            () => moveToAct(
              scene.id,
              ACTS[actIndex + 1]
            )
          );

        controls.append(
          previousActButton,
          upButton,
          downButton,
          nextActButton
        );

        return controls;
      }

      function createMoveButton(
        symbol,
        title,
        disabled,
        handler
      ) {
        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "move-btn";
        button.textContent = symbol;
        button.title = title;
        button.setAttribute(
          "aria-label",
          title
        );
        button.disabled = disabled;

        if (!disabled) {
          button.addEventListener(
            "click",
            event => {
              event.stopPropagation();
              handler();
            }
          );
        }

        return button;
      }

      /* ---------------- Mobile movement ---------------- */

      function moveWithinAct(id, direction) {
        const scene =
          scenes.find(item => item.id === id);

        if (!scene) return;

        const actScenes =
          getOrderedScenes().filter(
            item => item.act === scene.act
          );

        const currentIndex =
          actScenes.findIndex(
            item => item.id === id
          );

        const newIndex =
          currentIndex + direction;

        if (
          currentIndex < 0 ||
          newIndex < 0 ||
          newIndex >= actScenes.length
        ) {
          return;
        }

        const target =
          actScenes[newIndex];

        const globalCurrent =
          scenes.findIndex(
            item => item.id === id
          );

        const globalTarget =
          scenes.findIndex(
            item => item.id === target.id
          );

        if (
          globalCurrent === -1 ||
          globalTarget === -1
        ) {
          return;
        }

        [
          scenes[globalCurrent],
          scenes[globalTarget]
        ] = [
          scenes[globalTarget],
          scenes[globalCurrent]
        ];

        normalizeSceneOrder();
        saveScenes();
        render();

        showToast(
          direction < 0
            ? "Scene moved up"
            : "Scene moved down"
        );
      }

      function moveToAct(id, targetAct) {
        if (!targetAct) return;

        const scene =
          scenes.find(item => item.id === id);

        if (!scene) return;

        const oldAct =
          scene.act;

        const ordered =
          getOrderedScenes();

        const oldActScenes =
          ordered.filter(
            item => item.act === oldAct
          );

        const oldIndex =
          oldActScenes.findIndex(
            item => item.id === id
          );

        scene.act = targetAct;

        /*
         * Rebuild the board:
         * remove the scene, then insert it at
         * the end of the destination act.
         */
        const remaining =
          ordered.filter(
            item => item.id !== id
          );

        let insertionIndex = 0;

        for (
          let i = 0;
          i < remaining.length;
          i++
        ) {
          if (
            remaining[i].act === targetAct
          ) {
            insertionIndex = i + 1;
          }
        }

        remaining.splice(
          insertionIndex,
          0,
          scene
        );

        scenes = remaining;

        normalizeSceneOrder();
        saveScenes();
        render();

        showToast(
          `${scene.heading} moved to ${targetAct}`
        );
      }

      /* ---------------- Modal ---------------- */

      function openAddModal() {
        editingId = null;

        modalTitle.textContent = "Add scene";
        saveBtn.textContent = "Add scene";

        sceneForm.reset();
        actInput.value = "Act 1";

        modalBackdrop.classList.add("open");

        setTimeout(
          () => headingInput.focus(),
          50
        );
      }

      function openEditModal(id) {
        const scene =
          scenes.find(
            item => item.id === id
          );

        if (!scene) return;

        editingId = id;

        modalTitle.textContent = "Edit scene";
        saveBtn.textContent = "Save changes";

        headingInput.value =
          scene.heading || "";

        beatInput.value =
          scene.beat || "";

        charactersInput.value =
          Array.isArray(scene.characters)
            ? scene.characters.join(", ")
            : "";

        actInput.value =
          scene.act || "Act 1";

        modalBackdrop.classList.add("open");

        setTimeout(
          () => headingInput.focus(),
          50
        );
      }

      function closeModal() {
        modalBackdrop.classList.remove("open");
        editingId = null;
        sceneForm.reset();
      }

      function deleteScene(id) {
        const scene =
          scenes.find(
            item => item.id === id
          );

        if (!scene) return;

        const confirmed =
          window.confirm(
            `Delete this scene?\n\n${scene.heading}`
          );

        if (!confirmed) return;

        scenes =
          scenes.filter(
            item => item.id !== id
          );

        normalizeSceneOrder();

        saveScenes();
        render();

        showToast("Scene deleted");
      }

      sceneForm.addEventListener(
        "submit",
        event => {
          event.preventDefault();

          const heading =
            headingInput.value.trim();

          const beat =
            beatInput.value.trim();

          const characters =
            charactersInput.value
              .split(",")
              .map(name => name.trim())
              .filter(Boolean);

          const act =
            actInput.value;

          if (!heading || !beat) {
            return;
          }

          if (editingId) {
            const scene =
              scenes.find(
                item => item.id === editingId
              );

            if (scene) {
              scene.heading = heading;
              scene.beat = beat;
              scene.characters = characters;
              scene.act = act;
            }

            showToast("Scene updated");
          } else {
            scenes.push({
              id: crypto.randomUUID(),
              heading,
              beat,
              characters,
              act
            });

            showToast("Scene added");
          }

          normalizeSceneOrder();
          saveScenes();
          render();
          closeModal();
        }
      );

      addBtn.addEventListener(
        "click",
        openAddModal
      );

      cancelBtn.addEventListener(
        "click",
        closeModal
      );

      modalBackdrop.addEventListener(
        "click",
        event => {
          if (
            event.target === modalBackdrop
          ) {
            closeModal();
          }
        }
      );

      document.addEventListener(
        "keydown",
        event => {
          if (
            event.key === "Escape" &&
            modalBackdrop.classList.contains(
              "open"
            )
          ) {
            closeModal();
          }
        }
      );

      /* ---------------- Title editing ---------------- */

      screenplayTitleElement.addEventListener(
        "click",
        startTitleEdit
      );

      document
        .querySelector(".title-edit-icon")
        .addEventListener(
          "click",
          startTitleEdit
        );

      function startTitleEdit() {
        titleInput.value =
          screenplayTitle;

        screenplayTitleElement.style.display =
          "none";

        document
          .querySelector(".title-edit-icon")
          .style.display = "none";

        titleInput.style.display =
          "block";

        titleInput.focus();
        titleInput.select();
      }

      function finishTitleEdit(save = true) {
        if (
          titleInput.style.display === "none"
        ) {
          return;
        }

        if (save) {
          const value =
            titleInput.value.trim();

          screenplayTitle =
            value || "Untitled screenplay";

          saveTitle();
        }

        titleInput.style.display =
          "none";

        screenplayTitleElement.style.display =
          "block";

        document
          .querySelector(".title-edit-icon")
          .style.display = "";

        screenplayTitleElement.textContent =
          screenplayTitle;
      }

      titleInput.addEventListener(
        "keydown",
        event => {
          if (event.key === "Enter") {
            event.preventDefault();
            finishTitleEdit(true);
          }

          if (event.key === "Escape") {
            event.preventDefault();
            finishTitleEdit(false);
          }
        }
      );

      titleInput.addEventListener(
        "blur",
        () => finishTitleEdit(true)
      );

      /* ---------------- Drag and drop ---------------- */

      function setupDragAndDrop() {
        const cards =
          document.querySelectorAll(
            ".scene-card"
          );

        const columns =
          document.querySelectorAll(
            ".act-column"
          );

        cards.forEach(card => {
          card.addEventListener(
            "dragstart",
            handleDragStart
          );

          card.addEventListener(
            "dragend",
            handleDragEnd
          );

          card.addEventListener(
            "dragover",
            handleCardDragOver
          );

          card.addEventListener(
            "dragleave",
            handleCardDragLeave
          );

          card.addEventListener(
            "drop",
            handleCardDrop
          );
        });

        columns.forEach(column => {
          column.addEventListener(
            "dragover",
            handleColumnDragOver
          );

          column.addEventListener(
            "dragleave",
            handleColumnDragLeave
          );

          column.addEventListener(
            "drop",
            handleColumnDrop
          );
        });
      }

      function handleDragStart(event) {
        draggedId =
          event.currentTarget.dataset.id;

        event.currentTarget.classList.add(
          "dragging"
        );

        event.dataTransfer.effectAllowed =
          "move";

        event.dataTransfer.setData(
          "text/plain",
          draggedId
        );
      }

      function handleDragEnd(event) {
        event.currentTarget.classList.remove(
          "dragging"
        );

        document
          .querySelectorAll(
            ".drag-over, .drop-target"
          )
          .forEach(element => {
            element.classList.remove(
              "drag-over",
              "drop-target"
            );
          });

        draggedId = null;
      }

      function handleColumnDragOver(event) {
        event.preventDefault();

        if (!draggedId) return;

        event.currentTarget.classList.add(
          "drag-over"
        );
      }

      function handleColumnDragLeave(event) {
        if (
          !event.currentTarget.contains(
            event.relatedTarget
          )
        ) {
          event.currentTarget.classList.remove(
            "drag-over"
          );
        }
      }

      function handleCardDragOver(event) {
        event.preventDefault();
        event.stopPropagation();

        const card =
          event.currentTarget;

        if (
          card.dataset.id !== draggedId
        ) {
          card.classList.add(
            "drop-target"
          );
        }
      }

      function handleCardDragLeave(event) {
        event.currentTarget.classList.remove(
          "drop-target"
        );
      }

      function handleCardDrop(event) {
        event.preventDefault();
        event.stopPropagation();

        const targetCard =
          event.currentTarget;

        const targetId =
          targetCard.dataset.id;

        if (
          !draggedId ||
          draggedId === targetId
        ) {
          return;
        }

        moveSceneBefore(
          draggedId,
          targetId
        );

        targetCard.classList.remove(
          "drop-target"
        );

        saveScenes();
        render();

        showToast("Scenes reordered");
      }

      function handleColumnDrop(event) {
        event.preventDefault();

        const column =
          event.currentTarget;

        const targetAct =
          column.dataset.act;

        column.classList.remove(
          "drag-over"
        );

        if (!draggedId) return;

        /*
         * If the drop happened on a card,
         * handleCardDrop owns the operation.
         */
        if (
          event.target.closest(
            ".scene-card"
          )
        ) {
          return;
        }

        const scene =
          scenes.find(
            item => item.id === draggedId
          );

        if (!scene) return;

        const ordered =
          getOrderedScenes();

        const remaining =
          ordered.filter(
            item => item.id !== draggedId
          );

        scene.act = targetAct;

        /*
         * Append to the end of the target act.
         */
        let insertionIndex = 0;

        remaining.forEach(
          (item, index) => {
            if (
              item.act === targetAct
            ) {
              insertionIndex = index + 1;
            }
          }
        );

        remaining.splice(
          insertionIndex,
          0,
          scene
        );

        scenes = remaining;

        normalizeSceneOrder();
        saveScenes();
        render();

        showToast("Scene moved");
      }

      function moveSceneBefore(
        draggedId,
        targetId
      ) {
        const ordered =
          getOrderedScenes();

        const draggedIndex =
          ordered.findIndex(
            item => item.id === draggedId
          );

        const targetIndex =
          ordered.findIndex(
            item => item.id === targetId
          );

        if (
          draggedIndex === -1 ||
          targetIndex === -1
        ) {
          return;
        }

        const dragged =
          ordered[draggedIndex];

        const target =
          ordered[targetIndex];

        /*
         * Moving across acts changes the dragged
         * scene's act to the target card's act.
         */
        dragged.act =
          target.act;

        ordered.splice(
          draggedIndex,
          1
        );

        const newTargetIndex =
          ordered.findIndex(
            item => item.id === targetId
          );

        ordered.splice(
          newTargetIndex,
          0,
          dragged
        );

        scenes = ordered;

        normalizeSceneOrder();
      }

      /* ---------------- Export ---------------- */

      exportBtn.addEventListener(
        "click",
        () => {
          const ordered =
            getOrderedScenes();

          if (ordered.length === 0) {
            showToast(
              "Nothing to export yet"
            );
            return;
          }

          const lines = [];

          lines.push(
            screenplayTitle.toUpperCase()
          );

          lines.push(
            "=".repeat(
              screenplayTitle.length
            )
          );

          lines.push("");

          let number = 1;

          ACTS.forEach(act => {
            const actScenes =
              ordered.filter(
                scene => scene.act === act
              );

            if (actScenes.length === 0) {
              return;
            }

            lines.push(
              act.toUpperCase()
            );

            lines.push(
              "-".repeat(
                act.length
              )
            );

            lines.push("");

            actScenes.forEach(scene => {
              const characterText =
                scene.characters.length
                  ? ` [${scene.characters.join(", ")}]`
                  : "";

              lines.push(
                `${number}. ${scene.heading}`
              );

              lines.push(
                `   ${scene.beat}${characterText}`
              );

              lines.push("");

              number++;
            });
          });

          const text =
            lines.join("\n");

          const blob =
            new Blob(
              [text],
              {
                type:
                  "text/plain;charset=utf-8"
              }
            );

          const url =
            URL.createObjectURL(blob);

          const link =
            document.createElement("a");

          link.href = url;

          link.download =
            makeExportFilename(
              screenplayTitle
            );

          document.body.appendChild(
            link
          );

          link.click();
          link.remove();

          URL.revokeObjectURL(url);

          showToast(
            "Outline exported"
          );
        }
      );

      function makeExportFilename(title) {
        let filename =
          title
            .trim()
            .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
            .replace(/\s+/g, " ")
            .trim();

        if (!filename) {
          filename = "screenplay-outline";
        }

        return `${filename}.txt`;
      }

      /* ---------------- Toast ---------------- */

      let toastTimer;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer =
          setTimeout(
            () => {
              toast.classList.remove(
                "show"
              );
            },
            1800
          );
      }

      /* ---------------- Initial render ---------------- */

      render();

    })();
  </script>

</body>
</html>
